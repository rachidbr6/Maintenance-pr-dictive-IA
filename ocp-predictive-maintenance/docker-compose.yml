services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: pdm-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    container_name: pdm-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-maintenance}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?definir INFLUX_PASSWORD dans .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-maintenance}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-vibrations}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?definir INFLUX_TOKEN dans .env}
    volumes:
      - influx-data:/var/lib/influxdb2

volumes:
  mosquitto-data:
  influx-data:
